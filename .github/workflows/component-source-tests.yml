name: Isolated owned component and vendor contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  component-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r components/sms-api/requirements.txt fastapi==0.141.1 starlette==1.6.0 uvicorn==0.52.4 PyYAML==6.0.3
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  vendor-config-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y lua5.1
      - run: lua5.1 tests/kong_plugin_contract.lua
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate frozen external fragments from trusted Git base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BOOTSTRAP_BASE_SHA: ca31307942895370b468fc5358697ccf1ddfde7e
          CONTRACT_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          trusted="$RUNNER_TEMP/trusted-vendor-contract"
          mkdir -p "$trusted"
          if git cat-file -e "$BASE_SHA:tests/vendor_config_contract.py" 2>/dev/null; then
            git diff --exit-code "$BASE_SHA" -- tests/vendor_config_contract.py tests/test_vendor_contract.py .github/workflows/component-source-tests.yml
            git archive "$BASE_SHA" tests/vendor_config_contract.py tests/test_vendor_contract.py | tar -x -C "$trusted"
          else
            test "$BASE_SHA" = "$BOOTSTRAP_BASE_SHA"
            mkdir -p "$trusted/tests"
            cp tests/vendor_config_contract.py tests/test_vendor_contract.py "$trusted/tests/"
          fi
          python3 -m unittest discover -s "$trusted/tests" -p test_vendor_contract.py -v
          python3 "$trusted/tests/vendor_config_contract.py"
