name: Isolated owned component and vendor contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  component-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r components/sms-api/requirements.txt fastapi==0.141.1 starlette==1.6.0 uvicorn==0.52.4
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  vendor-config-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y lua5.1
      - run: lua5.1 tests/kong_plugin_contract.lua
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python3 tests/vendor_config_contract.py
