name: build-authority

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  immutable-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - kong-service-auth-adapter
          - monitoring-receiver
          - private-integration-gateway
          - sms-api
          - sms-api-event-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Resolve reviewed build context
        run: |
          set -euo pipefail
          context="components/${{ matrix.component }}"
          if [ "${{ matrix.component }}" = sms-api-event-worker ]; then
            context=components/sms-api
          fi
          printf 'BUILD_CONTEXT=%s\n' "$context" >> "$GITHUB_ENV"
      - name: Build local security candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: false
          load: true
          tags: local/${{ matrix.component }}:${{ github.event.pull_request.head.sha || github.sha }}
          build-args: |
            VCS_REF=${{ github.event.pull_request.head.sha || github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.event.pull_request.head.sha || github.sha }}
          provenance: false
          sbom: false
      - name: Exercise actual final image in a read-only container without network
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pattern="test_${COMPONENT//-/_}.py"
          source_root=/app
          if [[ "$COMPONENT" == sms-api* ]]; then source_root=/srv; fi
          docker run --rm --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$PWD:/source:ro" -e "COMPONENT_SOURCE_ROOT=$source_root" \
            --entrypoint python "local/$COMPONENT:$IMAGE_SHA" \
            -m unittest discover -s /source/tests -p "$pattern" -v
          if [[ "$COMPONENT" == sms-api ]]; then
            docker run --rm --network none --read-only --user 65532:65532 \
              --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,nodev,size=64m \
              -v "$PWD:/source:ro" -e PYTHONPATH=/srv \
              --entrypoint python "local/$COMPONENT:$IMAGE_SHA" \
              -m unittest discover -s /source/components/sms-api/tests -p 'test_*.py' -v
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/${{ matrix.component }}:${{ github.event.pull_request.head.sha || github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.event.pull_request.head.sha || github.sha }}
          build-args: |
            VCS_REF=${{ github.event.pull_request.head.sha || github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.event.pull_request.head.sha || github.sha }}
          provenance: mode=max
          sbom: true
      - name: Verify registry-native SBOM and provenance
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM }}' > sbom.json
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .Provenance }}' > provenance.json
          jq -e 'type == "object" and length > 0' sbom.json >/dev/null
          jq -e 'type == "object" and length > 0' provenance.json >/dev/null
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{ json .Config.Labels }}' > labels.json
          jq -e --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA}" '
            .["org.opencontainers.image.source"] == $source and
            .["org.opencontainers.image.revision"] == $sha and
            .["org.opencontainers.image.version"] == $sha
          ' labels.json >/dev/null
          printf '%s\n' "SOURCE_SHA=${GITHUB_SHA}" "IMAGE_DIGEST=${{ steps.build.outputs.digest }}" \
            "SBOM=PASS" "PROVENANCE=PASS" "VULNERABILITY_GATE=PASS" \
            "OCI_SOURCE=PASS" "OCI_REVISION=PASS" "OCI_VERSION=PASS" \
            > candidate-${{ matrix.component }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push'
        with:
          name: candidate-${{ matrix.component }}
          path: candidate-${{ matrix.component }}.txt
