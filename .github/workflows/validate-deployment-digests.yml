name: Validate immutable deployment digests

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: codestra_ci
          POSTGRES_USER: codestra_ci
          POSTGRES_PASSWORD: ci-disposable-only
        ports: [5432/tcp]
        options: --health-cmd "pg_isready -U codestra_ci -d codestra_ci" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prove exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input -r components/sms-api/requirements.txt pytest==8.4.2
      - name: Run application contract tests
        env:
          CI_DATABASE_URL: postgresql://codestra_ci:ci-disposable-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/codestra_ci
          CI_DATABASE_ISOLATED: 'true'
        run: |
          PYTHONPATH=components/sms-api python -m pytest -q components/sms-api/tests
          python -m unittest discover -s components/private-integration-gateway -p 'test_*.py'
          PYTHONPATH=tests python -m unittest discover -s tests -p postgres_contract.py -v
      - name: Validate Compose and immutable application references
        run: |
          for file in \
            components/kong-service-auth-adapter/compose.yaml \
            components/monitoring-receiver/compose.yaml \
            components/private-integration-gateway/compose.yaml \
            components/private-integration-gateway/compose.shared.yaml \
            components/sms-api/compose.yaml; do
            docker compose -f "$file" config --no-interpolate --no-env-resolution >/dev/null
          done
          python - <<'PY'
          import re
          from pathlib import Path
          required = {
              "ghcr.io/appolon1908-hue/kong-service-auth-adapter",
              "ghcr.io/appolon1908-hue/monitoring-receiver",
              "ghcr.io/appolon1908-hue/private-integration-gateway",
              "ghcr.io/appolon1908-hue/sms-api",
              "ghcr.io/appolon1908-hue/sms-api-event-worker",
          }
          found = set()
          for path in Path("components").glob("**/compose*.yaml"):
              for value in re.findall(r"^\s*image:\s*(\S+)", path.read_text(), re.M):
                  if "ghcr.io/" in value:
                      assert re.fullmatch(r"[^@]+@sha256:[0-9a-f]{64}", value), (path, value)
                      found.add(value.split("@", 1)[0])
          assert required <= found, required - found
          kong = Path("vendor/kong-gateway/compose.yaml").read_text()
          assert 'KONG_NGINX_WORKER_PROCESSES: "4"' in kong
          PY
